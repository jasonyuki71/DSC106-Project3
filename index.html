<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warming Across Latitudes</title>
  <style>
    body {
      max-width: 950px;
      margin: 2rem auto;
      padding: 0 1rem;
      font: 1rem/1.5 system-ui, sans-serif;
      color: #172936;
    }

    #heatmap {
      display: block;
      width: 100%;
      height: auto;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    #detail {
      min-height: 1.5em;
    }

    .source {
      color: #52616b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>How does warming vary across latitudes and over time?</h1>
    <p>Each column is a decade. Hover over a cell to see its value, or click to pin it.</p>

    <p id="status" role="status">Loading temperature data…</p>

    <section id="chart" hidden>
      <svg id="heatmap" viewBox="0 0 900 380"
           role="img" aria-label="Temperature anomalies by decade and latitude"></svg>

      <div class="legend">
        <span>Temperature anomaly (°C)</span>
        <svg id="color-key" width="210" height="38"
             role="img" aria-label="Blue is cooler and red is warmer"></svg>
      </div>

      <p id="detail"></p>
      <p class="source">CMIP6 CanESM5 simulation · Baseline 1850–1879</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script type="module">
    const status = document.querySelector("#status");

    try {
      if (!window.d3) {
        throw new Error("D3 could not load. Check your internet connection and reload.");
      }

      const d3 = window.d3;
      const csv = await d3.csv("warming_by_decade.csv");

      const requiredColumns = ["decade", "latitude", "anomaly"];
      const missingColumns = requiredColumns.filter(name => !csv.columns.includes(name));

      if (missingColumns.length) {
        throw new Error(
          `Missing CSV columns: ${missingColumns.join(", ")}. ` +
          `Found: ${csv.columns.join(", ") || "none"}.`
        );
      }

      // Convert CSV text to numbers. Keep blank values as missing.
      function toNumber(value) {
        return value?.trim() ? Number(value) : NaN;
      }

      const rows = csv.map(row => ({
        decade: toNumber(row.decade),
        latitude: toNumber(row.latitude),
        anomaly: toNumber(row.anomaly)
      })).filter(row =>
        Number.isInteger(row.decade) &&
        Number.isFinite(row.latitude) &&
        Math.abs(row.latitude) <= 90
      );

      const cells = rows.filter(row => Number.isFinite(row.anomaly));

      if (cells.length === 0) {
        throw new Error(
          "The CSV has no plottable rows. Use numeric values like 1850, -30, and 0.25."
        );
      }

      const decades = [...new Set(rows.map(row => row.decade))].sort((a, b) => a - b);
      const latitudes = [...new Set(rows.map(row => row.latitude))].sort((a, b) => a - b);

      // Place the edge of each latitude band halfway to its neighbor.
      const bandEdges = new Map(latitudes.map((latitude, i) => [
        latitude,
        {
          south: i === 0 ? -90 : (latitudes[i - 1] + latitude) / 2,
          north: i === latitudes.length - 1 ? 90 : (latitude + latitudes[i + 1]) / 2
        }
      ]));

      const svg = d3.select("#heatmap");
      const key = d3.select("#color-key");
      const detail = d3.select("#detail");

      const left = 58;
      const right = 880;
      const top = 16;
      const bottom = 345;

      const x = d3.scaleBand()
        .domain(decades)
        .range([left, right]);

      const y = d3.scaleLinear()
        .domain([-90, 90])
        .range([bottom, top]);

      const limit = Math.max(1, Math.ceil(d3.max(cells, cell => Math.abs(cell.anomaly))));

      const color = d3.scaleLinear()
        .domain([-limit, 0, limit])
        .range(["#226586", "#fbf6eb", "#ad3423"])
        .interpolate(d3.interpolateLab);

      function formatLatitude(value) {
        if (value === 0) return "0°";
        return `${Math.abs(value)}°${value < 0 ? "S" : "N"}`;
      }

      const rectangles = svg.append("g")
        .selectAll("rect")
        .data(cells)
        .join("rect")
        .attr("x", cell => x(cell.decade))
        .attr("y", cell => y(bandEdges.get(cell.latitude).north))
        .attr("width", x.bandwidth())
        .attr("height", cell => {
          const { south, north } = bandEdges.get(cell.latitude);
          return y(south) - y(north);
        })
        .attr("fill", cell => color(cell.anomaly))
        .style("cursor", "pointer");

      svg.append("g")
        .attr("transform", `translate(0,${bottom})`)
        .call(d3.axisBottom(x)
          .tickValues(decades.filter((_, i) => i % 2 === 0))
          .tickFormat(d3.format("d")));

      svg.append("g")
        .attr("transform", `translate(${left},0)`)
        .call(d3.axisLeft(y)
          .tickValues([-90, -60, -30, 0, 30, 60, 90])
          .tickFormat(formatLatitude));

      svg.append("line")
        .attr("x1", left)
        .attr("x2", right)
        .attr("y1", y(0))
        .attr("y2", y(0))
        .attr("stroke", "#172936")
        .attr("opacity", 0.4)
        .attr("pointer-events", "none");

      const outline = svg.append("rect")
        .attr("y", top)
        .attr("width", x.bandwidth())
        .attr("height", bottom - top)
        .attr("fill", "none")
        .attr("stroke", "#172936")
        .attr("stroke-width", 2)
        .attr("pointer-events", "none")
        .attr("visibility", "hidden");

      const dot = svg.append("circle")
        .attr("r", 4)
        .attr("fill", "white")
        .attr("stroke", "#172936")
        .attr("stroke-width", 2)
        .attr("pointer-events", "none")
        .attr("visibility", "hidden");

      const legendX = d3.scaleLinear()
        .domain([-limit, limit])
        .range([12, 198]);

      key.selectAll("rect")
        .data(d3.range(12, 198))
        .join("rect")
        .attr("x", pixel => pixel)
        .attr("y", 3)
        .attr("width", 1)
        .attr("height", 12)
        .attr("fill", pixel => color(legendX.invert(pixel + 0.5)));

      key.append("g")
        .attr("transform", "translate(0,15)")
        .call(d3.axisBottom(legendX)
          .tickValues([-limit, 0, limit])
          .tickFormat(value => value === 0 ? "0" : d3.format("+d")(value)));

      let pinnedCell = null;
      const prompt = "Hover over a cell to see its temperature anomaly.";
      const formatAnomaly = d3.format("+.2f");
      detail.text(prompt);

      function showDetails(cell) {
        const end = Math.min(cell.decade + 9, 2014);
        const latitude = formatLatitude(+cell.latitude.toFixed(1));
        detail.text(
          `${cell.decade}–${end} · ${latitude} · ${formatAnomaly(cell.anomaly)} °C`
        );
      }

      rectangles
        .on("pointerenter", (_, cell) => showDetails(cell))
        .on("click", (_, cell) => {
          pinnedCell = cell;
          outline.attr("x", x(cell.decade)).attr("visibility", "visible");
          dot.attr("cx", x(cell.decade) + x.bandwidth() / 2)
            .attr("cy", y(cell.latitude))
            .attr("visibility", "visible");
          showDetails(cell);
        });

      svg.on("pointerleave", () => {
        if (pinnedCell) {
          showDetails(pinnedCell);
        } else {
          detail.text(prompt);
        }
      });

      document.querySelector("#chart").hidden = false;
      status.hidden = true;
    } catch (error) {
      status.textContent = `Could not display the heatmap. ${error.message}`;
      console.error(error);
    }
  </script>
</body>
</html>
