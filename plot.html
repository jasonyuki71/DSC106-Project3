<main class="wrap">
  <section>
    <h2>How does warming vary across latitudes and over time?</h2>
    <p>Each column is a decade. Hover over a cell to see its value, or click to pin it.</p>

    <svg id="heatmap" viewBox="0 0 900 380"
         role="img" aria-label="Temperature anomalies by decade and latitude">
    </svg>

    <div class="legend">
      <span>Temperature anomaly (°C)</span>
      <svg id="heatmap-key" width="200" height="38" style="width: 200px"
           role="img" aria-label="Blue is cooler and red is warmer">
      </svg>
    </div>

    <p id="heatmap-detail" style="min-height: 1.5em"></p>
    <p class="hint">CMIP6 CanESM5 simulation · Baseline 1850–1879</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<script type="module">
  const rows = await d3.csv("./warming_by_decade.csv", row => ({
    decade: +row.decade,
    latitude: +row.latitude,
    anomaly: +row.anomaly
  }));
  
const latitudes = [...new Set(rows.map(row => row.latitude))]
  .sort((a, b) => a - b);

const periods = Array.from(d3.group(rows, row => row.decade), ([start, group]) => {
  const byLatitude = new Map(group.map(row => [row.latitude, row.anomaly]));

  return {
    start,
    end: Math.min(start + 9, 2014),
    values: latitudes.map(latitude => byLatitude.get(latitude))
  };
}).sort((a, b) => a.start - b.start);

  const svg = d3.select("#heatmap");
  const key = d3.select("#heatmap-key");
  const detail = d3.select("#heatmap-detail");

  const left = 58;
  const right = 880;
  const top = 16;
  const bottom = 345;

  // One rectangle for each decade and latitude band.
  const cells = periods.flatMap(period =>
    period.values.map((anomaly, i) => ({
      start: period.start,
      end: period.end,
      latitude: latitudes[i],
      south: i === 0 ? -90 : (latitudes[i - 1] + latitudes[i]) / 2,
      north: i === latitudes.length - 1 ? 90 : (latitudes[i] + latitudes[i + 1]) / 2,
      anomaly
    }))
  );

  const x = d3.scaleBand()
    .domain(periods.map(period => period.start))
    .range([left, right]);

  const y = d3.scaleLinear()
    .domain([-90, 90])
    .range([bottom, top]);

  const limit = Math.ceil(d3.max(cells, cell => Math.abs(cell.anomaly)));
  const color = d3.scaleLinear()
    .domain([-limit, 0, limit])
    .range(["#226586", "#fbf6eb", "#ad3423"])
    .interpolate(d3.interpolateLab);

  function formatLatitude(value) {
    if (value === 0) return "0°";
    return `${Math.abs(value)}°${value < 0 ? "S" : "N"}`;
  }

  const rectangles = svg.append("g")
    .selectAll("rect")
    .data(cells)
    .join("rect")
    .attr("x", cell => x(cell.start))
    .attr("y", cell => y(cell.north))
    .attr("width", x.bandwidth())
    .attr("height", cell => y(cell.south) - y(cell.north))
    .attr("fill", cell => color(cell.anomaly))
    .style("cursor", "pointer");

  svg.append("g")
    .attr("transform", `translate(0,${bottom})`)
    .call(d3.axisBottom(x)
      .tickValues(x.domain().filter((_, i) => i % 2 === 0))
      .tickFormat(d3.format("d")));

  svg.append("g")
    .attr("transform", `translate(${left},0)`)
    .call(d3.axisLeft(y)
      .tickValues([-90, -60, -30, 0, 30, 60, 90])
      .tickFormat(formatLatitude));

  // Mark the equator and keep the selection above the cells.
  svg.append("line")
    .attr("x1", left).attr("x2", right)
    .attr("y1", y(0)).attr("y2", y(0))
    .attr("stroke", "#172936")
    .attr("opacity", 0.4)
    .attr("pointer-events", "none");

  const outline = svg.append("rect")
    .attr("y", top)
    .attr("width", x.bandwidth())
    .attr("height", bottom - top)
    .attr("fill", "none")
    .attr("stroke", "#172936")
    .attr("stroke-width", 2)
    .attr("pointer-events", "none")
    .attr("visibility", "hidden");

  const dot = svg.append("circle")
    .attr("r", 4)
    .attr("fill", "white")
    .attr("stroke", "#172936")
    .attr("stroke-width", 2)
    .attr("pointer-events", "none")
    .attr("visibility", "hidden");

  const legendX = d3.scaleLinear().domain([-limit, limit]).range([10, 190]);

  key.selectAll("rect")
    .data(d3.range(180))
    .join("rect")
    .attr("x", i => i + 10)
    .attr("y", 3)
    .attr("width", 1)
    .attr("height", 12)
    .attr("fill", i => color(legendX.invert(i + 10.5)));

  key.append("g")
    .attr("transform", "translate(0,15)")
    .call(d3.axisBottom(legendX)
      .tickValues([-limit, 0, limit])
      .tickFormat(value => value === 0 ? "0" : d3.format("+d")(value)));

  let pinnedCell = null;
  const prompt = "Hover over a cell to see its temperature anomaly.";
  detail.text(prompt);

  function showDetails(cell) {
    detail.text(
      `${cell.start}–${cell.end} · ` +
      `${formatLatitude(+cell.latitude.toFixed(1))} · ` +
      `${d3.format("+.2f")(cell.anomaly)} °C`
    );
  }

  rectangles
    .on("pointerenter", (_, cell) => showDetails(cell))
    .on("click", (_, cell) => {
      pinnedCell = cell;
      outline.attr("x", x(cell.start)).attr("visibility", "visible");
      dot.attr("cx", x(cell.start) + x.bandwidth() / 2)
        .attr("cy", y(cell.latitude))
        .attr("visibility", "visible");
      showDetails(cell);
    });

  svg.on("pointerleave", () => {
    if (pinnedCell) {
      showDetails(pinnedCell);
    } else {
      detail.text(prompt);
    }
  });
</script>
